# Postgres for local work only: `bun run db:start` starts it, `bun run db:reset` starts it over empty.
services:
  db:
    image: postgres:18
    ports:
      # DATABASE_PORT in .env moves it when 5432 is taken (docs/runbook.md).
      - ${DATABASE_PORT:-5432}:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
